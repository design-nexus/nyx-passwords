<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Passkey · Nyx Passwords</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      html, body { background: transparent; }
      body { margin: 0; background: var(--popover); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
      body.window { border: 0; border-radius: 0; background: var(--bg); padding: 20px; min-height: 100vh; box-sizing: border-box; }
      .top { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
      .top .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; }
      .top .name { font-weight: 600; color: var(--text); }
      .top button { margin-left: auto; }
      h1 { font-size: 14px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #detail { color: var(--dim); margin-top: 2px; }
      #detail:empty { display: none; }
      #choices { display: flex; flex-direction: column; gap: 2px; max-height: 232px; overflow-y: auto; scrollbar-width: thin; }
      #choices:empty { display: none; }
      .row { min-height: 44px; padding: 6px 8px; }
      .row:focus { background: var(--hover); outline: none; }
      .countdown { height: 3px; border-radius: 2px; background: var(--divider); overflow: hidden; }
      .countdown span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; animation: run var(--wait) linear forwards; }
      @keyframes run { to { transform: scaleX(0); } }
      .buttons { display: flex; gap: 8px; justify-content: flex-end; }
      .buttons:empty { display: none; }
      .buttons .left { margin-right: auto; }
    </style>
  </head>
  <body>
    <div class="top"><span class="mark" id="mark"></span><span class="name">Passwords</span><button class="icon small" id="close" title="Cancel"></button></div>
    <div><h1 id="title"></h1><div id="detail"></div></div>
    <div class="card" id="choices"></div>
    <div id="timer"></div>
    <div class="buttons" id="buttons"></div>
    <script src="nyx.js"></script>
    <script src="passkey.js"></script>
  </body>
</html>
